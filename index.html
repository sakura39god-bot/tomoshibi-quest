<script>
'use strict';
/* ===== utils ===== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(x*374761393+y*668265263+(s||0)*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function strSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ===== audio (procedural, starts after first tap) ===== */
const AU={ctx:null,master:null,sfxOn:true,musOn:true,theme:'village',step:0,timer:0};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.55;AU.master.connect(AU.ctx.destination);
    if(!AU.timer)AU.timer=setInterval(musicTick,230);}catch(e){AU.ctx=null}
}
function tone(f,d,type,v,slide,delay){
  if(!AU.ctx)return;
  try{const c=AU.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),gn=c.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
    gn.gain.setValueAtTime(v||.08,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(gn);gn.connect(AU.master);o.start(t);o.stop(t+d+.03);}catch(e){}
}
function sfx(n){
  if(!AU.sfxOn||!AU.ctx)return;
  switch(n){
    case'slash':tone(420,.09,'sawtooth',.06,140);break;
    case'hit':tone(200,.1,'square',.08,70);break;
    case'hurt':tone(260,.28,'sawtooth',.1,60);break;
    case'coin':tone(988,.06,'square',.05);tone(1319,.12,'square',.05,0,.06);break;

async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;

    for(let n=1;n<=3;n++)CL.docs[n]=db.doc('data/users/'+id+'/'+(n===1?'save':'save'+n));
    CL.ready=true;
    for(let n=1;n<=3;n++){
      try{const snap=await CL.docs[n].get();if(snap.exists){const d=snap.data();if(d&&typeof d.json==='string'&&d.json)CL.remote[n]={savedAt:d.savedAt||0,json:d.json}}}catch(e){}

function cloudKick(force){
  if(!CL.ready)return;
  if(force)CL.force=true;
  if(CL.busy||!Object.keys(CL.pend).length)return;
  if(CL.timer){if(!CL.force)return;clearTimeout(CL.timer);CL.timer=0}
  const wait=CL.force?0:Math.max(0,8000-(Date.now()-CL.last));
  CL.timer=setTimeout(async()=>{
    CL.timer=0;CL.busy=true;CL.force=false;
    const jobs=CL.pend;CL.pend={};
    for(const s of Object.keys(jobs)){
      const j=jobs[s];
      try{await CL.docs[s].set({savedAt:j.at,json:j.json});if(j.json)CL.remote[s]={savedAt:j.at,json:j.json};else delete CL.remote[s];CL.ok=true}catch(e){CL.ok=false}
    }
    CL.last=Date.now();CL.busy=false;if(Object.keys(CL.pend).length)cloudKick(false);
  },wait);
}

(function(){
  const zone=$('#stickZone'),st=$('#stick'),kn=$('#knob');let pid=null,cx=0,cy=0;
  function upd(e){
    const R=st.offsetWidth*.38;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d}

    const m=Math.min(1,d/R);

function updItems(dt){
  for(const it of items){

    it.x+=it.vx*dt;it.y+=it.vy*dt;it.vx*=Math.pow(.02,dt);it.vy*=Math.pow(.02,dt);
    if(blocked(it.x,it.y,.1,0)){it.x-=it.vx*dt;it.y-=it.vy*dt;it.vx=it.vy=0}
    const d=dist(it.x,it.y,PL.x,PL.y);
    if(d<1.7&&it.t>.35&&!PL.dead){const a=ang(it,PL);it.x+=Math.cos(a)*6*dt;it.y+=Math.sin(a)*6*dt}
    if(d<.5&&it.t>.2&&!PL.dead){
      it.life=-1;
      if(it.k==='coin'){S.coins+=Math.max(1,Math.round(it.n*(1+talVal('gd')/100)));sfx('coin')}
      else if(it.k==='heart'){S.hp=Math.min(S.maxHp,S.hp+4);sfx('pick');pop(PL.x,PL.y-.6,'+4','#7ee8c7')}
      else if(it.k==='key'){S.keys++;S.flags['key:'+A.id]=1;sfx('open');toast('ボス部屋のカギを手に入れた！')}
      else if(it.k==='shroom'){S.mush++;sfx('pick');toast('きのこ '+Math.min(5,S.mush)+'/5'+(S.mush>=5?' 料理人ミミのもとへ':''))}

}
function updShots(dt){
  for(const s of shots){
    s.t+=dt;s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    const t=tileAt(Math.floor(s.x),Math.floor(s.y));
    if(t===1||t===5||t===7||t===8||t===9||t===10){s.life=0;addPart(s.x,s.y,s.col,4,2,.3,.06);continue}
    if(s.from==='p'){
      for(const e of enemies){
        if(e.dead||s.hit.includes(e)||(e.boss&&!e.awake))continue;
        if(dist(s.x,s.y,e.x,e.y)<e.r+s.r){s.hit.push(e);xCrit=s.xc||0;hitSrc='bow';xRec=s.rc||0;dmgEnemy(e,s.dmg,Math.atan2(s.vy,s.vx),1);xCrit=0;hitSrc='sword';xRec=0;if(s.burn&&!e.dead){e.burn=s.burn;e.bt=.5;e.bd=s.bd||0}if(s.blind&&!e.dead&&!(e.blind>0)&&!(e.bImm>0)){e.blind=s.blind;if(e.boss)e.bImm=s.blind+3;pop(e.x,e.y-1,'目つぶし！','#bff6ff')}if(s.pierce--<=0){s.life=0;break}}
      }
    }else if(allyShotHit(s)){
    }else if(dist(s.x,s.y,PL.x,PL.y)<PL.r+s.r&&PL.roll<=0){hurtPlayer(s.dmg,s.x-s.vx*.1,s.y-s.vy*.1,s.src);if(PL.inv>.9)s.life=0}
  }
  shots=shots.filter(s=>s.life>0);
}
function updFx(dt){
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.05,dt);p.vy*=Math.pow(.05,dt)}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.t+=dt}
  pops=pops.filter(p=>p.t<.8);
}

/* ===== dialog system ===== */
let dq=[],dcb=null,dCur=null,dChars=0,dTimer=0;
function say(name,lines,cb){dq=lines.map(t=>({name,text:t}));dcb=cb||null;mode='talk';nextLine()}
function ask(name,text,choices){dq=[{name,text,choices}];dcb=null;mode='talk';nextLine()}
function nextLine(){
  if(dCur&&dChars<dCur.text.length&&!dCur.choices){dChars=dCur.text.length;renderDlg();return}
  if(!dq.length){endDialog();return}
  dCur=dq.shift();dChars=0;dTimer=0;
  $('#dialog').style.display='block';
  $('#dName').textContent=dCur.name||'';
  renderDlg();
}
function renderDlg(){
  $('#dText').textContent=dCur.text.slice(0,dChars);
  const ch=$('#dChoices');ch.textContent='';
  const full=dChars>=dCur.text.length;
  $('#dNext').style.display=(full&&!dCur.choices)?'block':'none';
  if(full&&dCur.choices){
    dCur.choices.forEach(c=>{
      const b=document.createElement('button');b.className='btn'+(c.ghost?' ghost':'');b.textContent=c.label;
      b.addEventListener('click',e=>{e.stopPropagation();sfx('menu');const f=c.fn;dCur=null;$('#dialog').style.display='none';mode='play';if(f)f()});
      ch.appendChild(b);
    });
  }
}
function endDialog(){
  dCur=null;$('#dialog').style.display='none';
  if(mode==='talk')mode='play';
  const cb=dcb;dcb=null;if(cb)cb();
}
$('#dialog').addEventListener('pointerdown',e=>{e.preventDefault();auInit();if(mode==='talk'&&dCur&&!dCur.choices)nextLine()});
function tickDialog(dt){
  if(!dCur)return;
  if(dChars<dCur.text.length){dTimer+=dt;const n=Math.floor(dTimer*45);if(n>dChars){dChars=Math.min(dCur.text.length,n);renderDlg()}}
  if(PRESS.a&&!dCur.choices)nextLine();
}

function drawArmorIcon(cv,d){

  c.clearRect(0,0,W,H);

    c.shadowBlur=0;c.fillStyle='rgba(255,255,255,.45)';c.fillRect(-1.5*u,-16*u,3*u,34*u);c.fillStyle=dark;c.fillRect(-10*u,2*u,20*u,2.5*u);
  }else if(d.slot==='l'){
    c.beginPath();c.moveTo(-15*u,-18*u);c.lineTo(15*u,-18*u);c.lineTo(17*u,22*u);c.lineTo(3*u,22*u);c.lineTo(0,-2*u);c.lineTo(-3*u,22*u);c.lineTo(-17*u,22*u);c.closePath();c.fill();c.stroke();
    c.shadowBlur=0;c.fillStyle=dark;c.fillRect(-15*u,-18*u,30*u,4*u);

function interact(){
  let best=null,bd=1.5;
  const fx=PL.x+PL.fx*.5,fy=PL.y+PL.fy*.5;
  if(homeInteract(fx,fy))return true;
  for(const n of npcs){const d=dist(fx,fy,n.x,n.y);if(d<bd){bd=d;best={t:'npc',o:n}}}
  for(const c of chests){if(c.open)continue;const d=dist(fx,fy,c.x,c.y);if(d<bd){bd=d;best={t:'chest',o:c}}}
  for(const s of signs){const d=dist(fx,fy,s.x,s.y);if(d<bd){bd=d;best={t:'sign',o:s}}}
  const tx=Math.floor(PL.x+PL.fx*.9),ty=Math.floor(PL.y+PL.fy*.9);
  if(!best&&tileAt(tx,ty)===T.D){
    if(S.keys>0){S.keys--;openDoors();toast('扉が開いた！');updHud()}else{toast('カギがかかっている（宝箱を探そう）');sfx('menu')}
    return true;
  }
  if(!best)return false;
  if(best.t==='npc')talkNpc(best.o);
  else if(best.t==='chest')openChest(best.o);
  else say('',[best.o.text]);
  return true;
}

/* ===== transitions & portals ===== */
function goto(fn){if(trans)return;trans={t:0,fn,did:false}}
function updTrans(dt){
  trans.t+=dt*3.2;
  if(trans.t>=1&&!trans.did){trans.did=true;trans.fn();hudCache=''}
  if(trans.t>=2)trans=null;
}
function checkPortal(){
  if(trans||PL.dead)return;
  const tx=Math.floor(PL.x),ty=Math.floor(PL.y);
  if(tileAt(tx,ty)!==T.PO)return;
  const p=A.portals[ty*A.w+tx];if(!p)return;
  if(typeof S!=='undefined'&&S.tut>=0&&A.id==='village'){
    if(PL.msgCd<=0){toast('チュートリアルを終えるまで村から出られない！（スキップも可）');PL.msgCd=2}
    const ang3=Math.atan2(PL.y-(ty+.5),PL.x-(tx+.5));PL.vx=Math.cos(ang3)*6;PL.vy=Math.sin(ang3)*6;
    return;
  }
  if(p.req&&!p.req()){
    if(PL.msgCd<=0){toast(p.msg||'まだ進めない');PL.msgCd=2}
    const ang2=Math.atan2(PL.y-(ty+.5),PL.x-(tx+.5));PL.vx=Math.cos(ang2)*6;PL.vy=Math.sin(ang2)*6;
    return;
  }
  sfx('open');
  if(p.kind==='hstair'){S.homeF=p.fl;goto(()=>loadArea('home',p.tx,p.ty))}
  else if(p.kind==='hdoor'){S.homeF='f1';goto(()=>loadArea('home'))}
  else if(p.kind==='tdoor'){S.floor=1;goto(()=>loadArea('tower'))}
  else if(p.kind==='tfloor'){S.floor=p.floor;goto(()=>loadArea('tower'))}
  else if(p.kind==='well'){S.floor=p.floor||1;goto(()=>loadArea('tower'))}
  else if(p.kind==='down'){

let NPCSTUCK=0,NPCGHOST=0;
function pushOut(x,y,r){
  const d=dist(PL.x,PL.y,x,y),m=PL.r+r;
  if(d<m&&d>.001){const nx=PL.x+(PL.x-x)/d*(m-d),ny=PL.y+(PL.y-y)/d*(m-d);
    if(!blocked(nx,ny,PL.r,0)){PL.x=nx;PL.y=ny;return true}
    if(!blocked(nx,PL.y,PL.r,0)){PL.x=nx;return true}
    if(!blocked(PL.x,ny,PL.r,0)){PL.y=ny;return true}
  }
  return false;
}
function update(dt){
  S.time+=dt;
  for(const k of['inv','rollCd','boltCd','burstCd','msgCd','atk','comboT','ultCd','ultT'])if(PL[k]>0)PL[k]-=dt;
  if(PL.comboT<=0)PL.combo=0;
  PL.anim+=dt;
  if(PL.dead)return;
  if(FRZ>0){FRZ-=dt;updFx(dt);return}
  const m=moveVec(),ml=Math.hypot(m.x,m.y);
  if(PL.roll>0){
    PL.roll-=dt;moveEnt(PL,PL.rx*9*dt,PL.ry*9*dt,PL.r,0);
    if(Math.random()<.5)parts.push({x:PL.x,y:PL.y,vx:0,vy:0,life:.25,max:.25,col:'#ffffff55',sz:.12});
  }else{
    const sp=4.2*Math.max(.3,1+swSpd()+armSpd()+talVal('sp')/100+bf('sp')/100);
    moveEnt(PL,m.x*sp*dt,m.y*sp*dt,PL.r,0);
    if(ml>.2)tutEvt('move',sp*dt*Math.min(1,ml));
    if(ml>.2&&mode==='play'){const gs=swCur();if(gs&&gs.id==='g1'){gbT+=dt;if(gbT>=1){gbT-=1;garbageTick()}}}
    if(ml>.2){PL.fx=m.x/ml;PL.fy=m.y/ml;if(Math.floor(PL.anim*7)%2===0&&Math.random()<.05)sfx('step')}
  }
  if(Math.abs(PL.vx)+Math.abs(PL.vy)>.2){moveEnt(PL,PL.vx*dt,PL.vy*dt,PL.r,0);const f=Math.pow(.003,dt);PL.vx*=f;PL.vy*=f}
  {let hit=false;
    if(NPCGHOST>0)NPCGHOST-=dt;
    else for(const n of npcs)if(pushOut(n.x,n.y,.3))hit=true;
    if(hit&&ml>.2)NPCSTUCK+=dt;else NPCSTUCK=Math.max(0,NPCSTUCK-dt*2);
    if(NPCSTUCK>.7){NPCSTUCK=0;NPCGHOST=2}}
  for(const c of chests)if(!c.open)pushOut(c.x,c.y,.3);
  S.mp=Math.min(S.maxMp,S.mp+dt*.35*(1+talVal('mp')/100+bf('mp')/100));
  {const mc=mythicCount();if(mc>0){
    if(Math.random()<dt*mc*3)parts.push({x:PL.x+rnd(-.35,.35),y:PL.y+rnd(-.2,.4),vx:rnd(-.3,.3),vy:rnd(-2.4,-1),life:1,max:1,col:Math.random()<.5?'#ffd700':'#fff3a8',sz:.09});
    if(mc>=3){MYT_T+=dt*3;for(let k=0;k<(mc>=6?2:1);k++){const a=MYT_T+k*3.1416;parts.push({x:PL.x+Math.cos(a)*.8,y:PL.y+.15+Math.sin(a)*.3,vx:0,vy:-.3,life:.4,max:.4,col:'#ffe27a',sz:.1})}}
    if(mc>=6&&Math.random()<dt*.7){for(let i=0;i<20;i++){const a=i*.314;parts.push({x:PL.x,y:PL.y+.2,vx:Math.cos(a)*3.2,vy:Math.sin(a)*1.4,life:.7,max:.7,col:'#ffd700',sz:.1})}}
  }}
  {const q=swCur();if(q&&swBig(q)&&Math.random()<dt*5)addPart(PL.x+rnd(-.4,.4),PL.y+rnd(-.5,.2),swCol(q),1,.6,.7,.07)}
  PL.holdT=BTN.a?(PL.holdT||0)+dt:0;
  if(S.keys>0&&ml>.2&&A.id!=='world'){const tx=Math.floor(PL.x+PL.fx*.75),ty=Math.floor(PL.y+PL.fy*.75);if(tileAt(tx,ty)===T.D){S.keys--;openDoors();toast('カギを使って扉が開いた！');updHud()}}
  const nowT=performance.now();
  const chord=(PRESS.x&&BTN.a&&nowT-BT.a<150)||(PRESS.a&&BTN.x&&nowT-BT.x<150);
  if(chord&&doUltimate()){}
  else{
    if(PRESS.a&&PL.atk<=.04){if(!interact())swingAttack()}
    else if(BTN.a&&PL.atk<=0&&PL.holdT>.2&&!(BTN.x&&nowT-BT.x<400))swingAttack();
    if(PRESS.b)doRoll();
    if(PRESS.x)doBolt();
    if(PRESS.y)doBurst();
  }
  for(const e of enemies)allyTarget(e,()=>updateEnemy(e,dt));
  enemies=enemies.filter(e=>!e.dead);
  updShots(dt);updItems(dt);updFx(dt);updAllies(dt);buffHud(dt);onTick(dt);wmTick(dt);
  for(const n of npcs)if(n.kind==='cat')n.t=(n.t||0)+dt;
  checkPortal();worldTick(dt);
}

let WB2=null;
function worldBase2(){
  if(WB2)return WB2;
  const W=W2W,H=W2H,a=mkArea('world2','',W,H,'field'),N=W*H;

    const o=k<6,ang=(o?-90+60*k:210+60*(k-6))*Math.PI/180,R=o?[60,46]:[30,24];
    return{cx:Math.round(W2CX+R[0]*Math.cos(ang)),cy:Math.round(W2CY+R[1]*Math.sin(ang)),rx:o?13:11,ry:o?10:9,k};
  });
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let best=-1,bd=9;
    for(const c of cen){const d=Math.hypot((x-c.cx)/c.rx,(y-c.cy)/c.ry),th=.74+.3*vnoise(x/4.5,y/4.5,c.k+41);if(d<th&&d<bd){bd=d;best=c.k}}
    if(x<2||y<2||x>W-3||y>H-3)best=-1;

    if(best>=0){a.t[i]=T.G;bio[i]=ISL2[best].bio;isle[i]=best}else a.t[i]=T.WA;
  }
  const land=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&isle[y*W+x]>=0;
  const core=(x,y,k)=>{if(!land(x,y)||isle[y*W+x]!==k)return false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(!land(x+dx,y+dy)||isle[(y+dy)*W+x+dx]!==k)return false;return true};
  const cores=cen.map(c=>{const l=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(core(x,y,c.k))l.push({x,y});return l});
  const nearest=(k,tx,ty)=>{let b=null,bd=1e9;for(const p of cores[k]){const d=dist(p.x,p.y,tx,ty);if(d<bd){bd=d;b=p}}return b};
  const farthest=(k,s)=>{let b=null,bd=-1;for(const p of cores[k]){if(!core(p.x,p.y+1,k)||!core(p.x,p.y+2,k)||!core(p.x-1,p.y,k)||!core(p.x+1,p.y,k))continue;const d=dist(p.x,p.y,s.x,s.y);if(d>bd){bd=d;b=p}}return b};
  const lay=[];
  for(let k=0;k<13;k++){
    const prev=k===0?{cx:0,cy:H/2}:cen[k-1];

    L.gate=farthest(k,shrine);lay.push(L);
  }
  for(let k=0;k<12;k++)lay[k].start=nearest(k,cen[k+1].cx,cen[k+1].cy);
  const rng=mulberry(27182);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,k=isle[i];if(k<0)continue;
    const b=bio[i],n=vnoise(x/3.3,y/3.3,k*7+13),r=rng();
    const dens=b===9?.74:b===5?.66:b===11?.68:.7;
    if(n>dens)a.t[i]=T.W;else if(r<.012&&(b===1||b===5))a.t[i]=T.BUSH;else if(r<.045)a.t[i]=T.DE;
  }
  for(const L of lay){
    const k=L.k,clear=(p,rx,ry)=>{for(let y=p.y-ry;y<=p.y+ry;y++)for(let x=p.x-rx;x<=p.x+rx;x++)if(isle[y*W+x]===k)a.t[y*W+x]=T.G};
    clear(L.shrine,3,3);if(L.start)clear(L.start,2,2);
    const g=L.gate;clear({x:g.x,y:g.y+2},3,2);
    carvePath(a,L.shrine.x,L.shrine.y,g.x,g.y+1,rng);
    if(L.start)carvePath(a,L.shrine.x,L.shrine.y,L.start.x,L.start.y,rng);
    for(const o of [[-1,0],[1,0],[-1,-1],[0,-1],[1,-1]])if(isle[(g.y+o[1])*W+g.x+o[0]]===k)a.t[(g.y+o[1])*W+g.x+o[0]]=T.W;
    a.t[(g.y+1)*W+g.x]=T.P;
    a.t[g.y*W+g.x]=T.PO;
  }
  const v={x:lay[0].shrine.x-4,y:lay[0].shrine.y};
  for(let y=v.y-1;y<=v.y+1;y++)for(let x=v.x-1;x<=v.x;x++)a.t[y*W+x]=T.W;
  for(let x=v.x+1;x<=v.x+3;x++)a.t[v.y*W+x]=T.P;
  a.t[v.y*W+v.x]=T.PO;lay[0].vg=v;
  for(let k=0;k<12;k++){
    const s=lay[k].start,e=lay[k+1].shrine,dx=e.x-s.x,dy=e.y-s.y,len=Math.hypot(dx,dy),st=Math.ceil(len*2),px=-dy/len,py=dx/len,seen={};
    for(let i=0;i<=st;i++){

  }

  return WB2;
}

function fishOpen(reg){

  let st='idle',t=0,wait=0,bite=0,msg='「なげる」をおして、うきが沈んだらタップ！',last=null,ff=0;
  const set=m=>{ov.inf.textContent=m};set(msg);

  const cast=()=>{if(st!=='idle')return;st='wait';t=0;wait=1.2+Math.random()*2.8;set('……うきを見つめよう');sfx('menu')};
  const hit=()=>{
    if(st==='wait'){st='idle';set('はやすぎた！ 魚がにげた…');sfx('menu')}
    else if(st==='bite'){const f=pick();S.fish[f.id]=(S.fish[f.id]||0)+1;last=f;st='got';t=0;set(f.n+' を釣った！（'+'☆'.repeat(f.tier+1)+'　'+f.v+'G）');sfx('level');saveGame(true)}
  };
  const btC=h('button','btn','なげる',cast),btH=h('button','btn','つりあげる！',hit);ov.bt.appendChild(btC);ov.bt.appendChild(btH);
  ov.bt.appendChild(h('button','btn ghost','おわる',ovClose));
  cv.addEventListener('pointerdown',e=>{e.preventDefault();auInit();if(st==='idle'||st==='got')cast();else hit()});
  ov.keys=e=>{if(e.key===' '||e.key==='j'||e.key==='J'||e.key==='Enter'){e.preventDefault();e.stopPropagation();if(st==='idle'||st==='got')cast();else hit()}};
  document.addEventListener('keydown',ov.keys,true);ov.get=()=>st;
  let lt=performance.now();
  const loop=now=>{
    if(!OV||OV.cv!==cv)return;const dt=Math.min(.05,(now-lt)/1000);lt=now;t+=dt;ff+=dt;
    if(st==='wait'&&t>=wait){st='bite';t=0;sfx('bolt')}
    else if(st==='bite'&&t>=.85){st='idle';set('にげられた…（もっと早くタップ！）')}
    else if(st==='got'&&t>1.6){st='idle'}
    const g=c;g.fillStyle='#7fc4ee';g.fillRect(0,0,360,110);g.fillStyle='#2a79b8';g.fillRect(0,110,360,130);
    g.fillStyle='#58a64d';g.fillRect(0,96,360,16);
    for(let i=0;i<8;i++){g.strokeStyle='rgba(255,255,255,.25)';g.beginPath();g.arc(30+i*48+Math.sin(ff+i)*6,150+(i%3)*28,10,0,3.2);g.stroke()}
    // fisher
    g.fillStyle='#3a2a1a';g.fillRect(36,60,14,34);g.fillStyle='#f2c9a0';g.beginPath();g.arc(43,54,9,0,7);g.fill();g.fillStyle='#e28a2b';g.fillRect(32,44,22,7);
    const bx=210,by=st==='bite'?150+Math.sin(ff*40)*4:140+Math.sin(ff*2)*2+(st==='wait'?Math.sin(ff*9)*1.5:0);
    g.strokeStyle='#333';g.lineWidth=2;g.beginPath();g.moveTo(50,62);g.lineTo(110,30);g.lineTo(bx,by);g.stroke();
    g.fillStyle='#ff5d6e';g.beginPath();g.arc(bx,by,7,3.14,6.283);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(bx,by,7,0,3.14);g.fill();
    if(st==='bite'){g.fillStyle='#ffd34d';g.font='bold 40px sans-serif';g.textAlign='center';g.fillText('！',bx,by-24);g.strokeStyle='#fff';g.beginPath();g.arc(bx,by+4,14+Math.sin(ff*30)*3,0,7);g.stroke()}
    if(st==='got'&&last){g.fillStyle='#ffd34d';g.font='bold 22px sans-serif';g.textAlign='center';g.fillText('🐟 '+last.n,bx,by-30-t*14)}
    OV.raf=requestAnimationFrame(loop)};
  OV.raf=requestAnimationFrame(loop);
}

const SLS=['🍒','🍋','🔔','⭐','7️⃣'],SLW=[34,28,20,12,6];
const SLP={'🍒':5,'🍋':9,'🔔':14,'⭐':40,'7️⃣':150};
function slotRoll(){return [0,1,2].map(()=>{let x=Math.random()*100,i=0;while(i<4&&x>=SLW[i]){x-=SLW[i];i++}return SLS[i]})}
function slotPay(r,bet){
  if(r[0]===r[1]&&r[1]===r[2])return bet*SLP[r[0]];
  if(r.filter(s=>s==='🍒').length===2)return Math.floor(bet*1.5);
  return 0;
}

function runnerNew(){return{x:60,y:0,vy:0,hp:3,inv:0,t:0,dist:0,coins:0,speed:220,obs:[],cns:[],nextObs:400,over:false,onG:true,pits:[],score:0,jumps:0}}
const RG=230; // ground y
function runnerStep(R,dt,jump){
  if(R.over)return;
  R.t+=dt;R.speed=Math.min(520,220+R.dist*.045);
  const dx=R.speed*dt;R.dist+=dx;
  if(jump&&R.onG){R.vy=-640;R.onG=false;R.jumps++}
  R.vy+=1700*dt;R.y+=R.vy*dt;
  const wx=R.dist; // world x of left edge
  const inPit=R.pits.some(p=>wx+R.x>p.x&&wx+R.x<p.x+p.w);
  if(R.y>=0&&!inPit){R.y=0;R.vy=0;R.onG=true}
  if(R.y>60){ // fell
    R.hp--;R.inv=1.4;R.y=-180;R.vy=0;R.onG=false;
    // move player past pit
    const p=R.pits.find(p=>wx+R.x>p.x-4&&wx+R.x<p.x+p.w+4);if(p)R.dist=p.x+p.w+20-R.x;
    if(R.hp<=0)R.over=true;
  }
  R.inv=Math.max(0,R.inv-dt);
  // spawn
  while(R.nextObs<wx+420){
    const x=R.nextObs,k=Math.random();
    if(k<.35)R.obs.push({k:'spike',x,w:22,h:20});
    else if(k<.6)R.obs.push({k:'block',x,w:30,h:30});
    else if(k<.78)R.pits.push({x,w:70+Math.random()*50});
    else if(k<.9)R.obs.push({k:'bird',x,w:26,h:18,y:-70-Math.random()*30});
    else R.obs.push({k:'block',x,w:30,h:30},{k:'block',x:x+30,w:30,h:60});
    if(Math.random()<.7)for(let i=0;i<4;i++)R.cns.push({x:x-40+i*26,y:-70-Math.sin(i/3*3.14)*46,got:false});
    R.nextObs+=Math.max(210,330-R.dist*.02)+Math.random()*180;
  }
  // collisions (player box 20x28 at x, y)
  const px=wx+R.x,py=R.y;
  for(const o of R.obs){
    if(o.x>px+40||o.x+o.w<px-20)continue;
    const oy=o.y!=null?o.y:-o.h;
    if(px+9>o.x&&px-9<o.x+o.w&&py-28<oy+o.h&&py>oy&&R.inv<=0){
      if(o.k==='block'&&py-0<=oy+4&&R.vy>=0){R.y=oy;R.vy=0;R.onG=true;continue}
      R.hp--;R.inv=1.4;R.vy=-380;R.onG=false;if(R.hp<=0)R.over=true;
    }
  }
  for(const c of R.cns)if(!c.got&&Math.abs(c.x-px)<18&&Math.abs(c.y-(py-14))<22){c.got=true;R.coins++}
  R.obs=R.obs.filter(o=>o.x>wx-80);R.cns=R.cns.filter(c=>!c.got&&c.x>wx-80);R.pits=R.pits.filter(p=>p.x+p.w>wx-80);
  R.score=Math.floor(R.dist/10)+R.coins*10;
}
function runnerOpen(){
  const ov=ovOpen(360,300,'コースラン'),cv=ov.cv,c=cv.getContext('2d');
  let R=runnerNew(),jump=false,done=false;
  ov.inf.textContent='タップ／スペースでジャンプ！';
  const jmp=()=>{jump=true};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();auInit();jmp()});
  ov.keys=e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='j'||e.key==='J'||e.key==='w'||e.key==='W'){e.preventDefault();e.stopPropagation();jmp()}};
  document.addEventListener('keydown',ov.keys,true);
  ov.bt.appendChild(h('button','btn','ジャンプ',jmp));
  const ex=h('button','btn ghost','やめる',()=>{finish();ovClose()});ov.bt.appendChild(ex);
  const finish=()=>{if(done)return;done=true;const sc=R.score,g=Math.floor(sc/25);S.coins+=g;S.arc=S.arc||{};const nb=sc>(S.arc.run||0);if(nb)S.arc.run=sc;sfx(g>=ARC_COST?'level':'menu');updHud();saveGame(true);
    toast('スコア '+sc+'　'+g+'G ゲット！'+(nb?'　ベスト更新！':''));};
  let lt=performance.now();
  const draw=()=>{
    const wx=R.dist;
    c.fillStyle='#5ec1ff';c.fillRect(0,0,360,RG);
    c.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<5;i++){const x=((i*140-wx*.2)%700+700)%700-60;c.beginPath();c.arc(x,40+i*18%60,18,0,7);c.arc(x+16,46+i*18%60,14,0,7);c.fill()}
    c.fillStyle='#7ac35a';c.fillRect(0,RG,360,70);c.fillStyle='#5a3a22';c.fillRect(0,RG+14,360,60);
    for(const p of R.pits){const sx=p.x-wx;if(sx>-200&&sx<400){c.fillStyle='#5ec1ff';c.fillRect(sx,RG,p.w,70);c.fillStyle='#220';c.fillRect(sx,RG+6,p.w,64)}}
    for(const o of R.obs){const sx=o.x-wx,oy=RG+(o.y!=null?o.y:-o.h);
      if(o.k==='spike'){c.fillStyle='#c8ccd8';c.beginPath();c.moveTo(sx,RG);c.lineTo(sx+o.w/2,RG-o.h);c.lineTo(sx+o.w,RG);c.fill()}
      else if(o.k==='block'){c.fillStyle='#b5651d';c.fillRect(sx,oy,o.w,o.h);c.strokeStyle='#5a3010';c.lineWidth=2;c.strokeRect(sx,oy,o.w,o.h)}
      else{c.fillStyle='#8b3fd0';c.beginPath();c.ellipse(sx+13,oy+9,13,8,0,0,7);c.fill();c.fillStyle='#fff';c.fillRect(sx+4,oy+6,4,4)}}
    for(const k of R.cns){const sx=k.x-wx;c.fillStyle='#ffd34d';c.beginPath();c.arc(sx,RG+k.y,6,0,7);c.fill();c.strokeStyle='#b8860b';c.stroke()}
    // player
    if(!(R.inv>0&&Math.floor(R.t*12)%2)){const py=RG+R.y;c.fillStyle='#ff9a2a';c.fillRect(R.x-9,py-26,18,20);c.fillStyle='#f2c9a0';c.beginPath();c.arc(R.x,py-30,8,0,7);c.fill();
      c.fillStyle='#ffd34d';c.beginPath();c.arc(R.x+12,py-14,5,0,7);c.fill();c.fillStyle='#4a2a10';c.fillRect(R.x-8,py-6,6,6);c.fillRect(R.x+2,py-6+(R.onG?Math.sin(R.t*20)*2:0),6,6)}
    c.fillStyle='#fff';c.font='bold 16px sans-serif';c.textAlign='left';c.fillText('スコア '+R.score,10,22);c.fillText('コイン '+R.coins,10,42);
    c.textAlign='right';c.fillText('♥'.repeat(Math.max(0,R.hp)),350,22);
    if(R.over){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,100,360,90);c.fillStyle='#ffd34d';c.font='bold 26px sans-serif';c.textAlign='center';c.fillText('ゲームオーバー',180,138);c.font='16px sans-serif';c.fillStyle='#fff';c.fillText('スコア '+R.score+'　→ '+Math.floor(R.score/25)+'G',180,168)}
  };
  const loop=now=>{
    if(!OV||OV.cv!==cv)return;const dt=Math.min(.033,(now-lt)/1000);lt=now;
    if(!R.over){runnerStep(R,dt,jump);jump=false;if(R.over)finish()}
    draw();OV.raf=requestAnimationFrame(loop)};
  OV.raf=requestAnimationFrame(loop);
  OV.stop=()=>{finish()};
}

/* ===== 召喚のタリスマン：仲間 / 再生 ===== */
let ALLY_T=0,ALLY_CD=[0,0,0],ALLY_FX=[null,null,null],RG_ACC=0;
function allyPos(i,n){const a=ALLY_T*1.4+i*6.283/Math.max(1,n);return{x:PL.x+Math.cos(a)*1.7,y:PL.y+Math.sin(a)*1.2-.2,i,a}}
let ALLY_HP=[-1,-1,-1],ALLY_DEAD=[0,0,0],ALLY_INV=[0,0,0],ALLYTGT=-1;
function allyMaxHp(){return Math.round(60+S.maxHp*.5)}
function allyAlive(i){return ALLY_DEAD[i]<=0}
function allyList(){const n=talAllies();if(!n||!PL||PL.dead||mode==='title')return[];const o=[];for(let i=0;i<n;i++)if(allyAlive(i))o.push(allyPos(i,n));return o}
function allyHurt(i,dmg){
  if(ALLY_INV[i]>0||!allyAlive(i))return;
  const d=Math.max(1,Math.round(dmg));ALLY_HP[i]-=d;ALLY_INV[i]=.8;
  const n=talAllies(),p=allyPos(i,n);pop(p.x,p.y-.6,'-'+d,'#9fd4ff');addPart(p.x,p.y,'#bfe9ff',6,2,.4);
  if(ALLY_HP[i]<=0){ALLY_HP[i]=0;ALLY_DEAD[i]=60;addPart(p.x,p.y,'#e8f6ff',16,3,.7);toast('仲間がたおれた…（しばらく戻ってこない）')}
}
function allyShotHit(s){const n=talAllies();if(!n)return false;for(let i=0;i<n;i++){if(!allyAlive(i))continue;const p=allyPos(i,n);if(dist(s.x,s.y,p.x,p.y)<.4+s.r){allyHurt(i,s.dmg*(1-Math.min(.3,S.lv*.01)));s.life=0;return true}}return false}
function allyTarget(e,fn){
  const n=talAllies();let bi=-1;
  if(n&&!PL.dead&&!(e.boss&&!e.awake)){let bd=8;for(let i=0;i<n;i++){if(!allyAlive(i))continue;const p=allyPos(i,n),q=dist(p.x,p.y,e.x,e.y);if(q<bd){bd=q;bi=i}}}
  if(bi<0){fn();return}
  const p=allyPos(bi,n),ox=PL.x,oy=PL.y;PL.x=p.x;PL.y=p.y;ALLYTGT=bi;
  try{fn()}finally{PL.x=ox;PL.y=oy;ALLYTGT=-1}
}
function updAllies(dt){
  ALLY_T+=dt;
  // 再生
  const rg=talVal('rg');
  if(rg&&!PL.dead){RG_ACC+=S.maxHp*rg/100*dt;
    if(RG_ACC>=1||RG_ACC<=-1){const d=Math.trunc(RG_ACC);RG_ACC-=d;S.hp=Math.max(1,Math.min(S.maxHp,S.hp+d));updHud()}}
  const d=talCur(),n=talAllies();if(!n||PL.dead||mode!=='play')return;
  const mh=allyMaxHp();
  for(let i=0;i<n;i++){
    if(ALLY_HP[i]<0||ALLY_HP[i]>mh)ALLY_HP[i]=mh;
    ALLY_INV[i]=Math.max(0,ALLY_INV[i]-dt);
    if(ALLY_DEAD[i]>0){ALLY_DEAD[i]-=dt;if(ALLY_DEAD[i]<=0){ALLY_DEAD[i]=0;ALLY_HP[i]=mh;toast('仲間が戻ってきた！')}continue}
    ALLY_HP[i]=Math.min(mh,ALLY_HP[i]+mh*.01*dt);
    ALLY_CD[i]=Math.max(0,ALLY_CD[i]-dt);if(ALLY_FX[i]){ALLY_FX[i].t-=dt;if(ALLY_FX[i].t<=0)ALLY_FX[i]=null}
    if(ALLY_CD[i]>0)continue;
    const p=allyPos(i,n);let best=null,bd=8;
    for(const e of enemies){if(e.dead||e.hp<=0||(e.boss&&!e.awake))continue;const q=dist(p.x,p.y,e.x,e.y);if(q<bd){bd=q;best=e}}
    if(!best)continue;
    ALLY_CD[i]=1.1;ALLY_FX[i]={x:best.x,y:best.y,t:.18};
    dmgEnemy(best,Math.max(1,Math.round(best.maxHp*d.v/100*(best.boss?.003:1))),Math.atan2(best.y-p.y,best.x-p.x),.1,'dot');
    addPart(best.x,best.y,'#bfe9ff',5,2,.3);
  }
}
function drawAlly(al){
  const p=sxy(al.x,al.y),s=TS,bob=Math.sin(ALLY_T*5+al.i)*s*.05;
  drawShadow(p[0],p[1]+s*.25,s*.2);
  g.save();g.globalAlpha=.9;
  const gr=g.createRadialGradient(p[0],p[1]+bob,2,p[0],p[1]+bob,s*.5);gr.addColorStop(0,'rgba(190,235,255,.6)');gr.addColorStop(1,'rgba(190,235,255,0)');
  g.fillStyle=gr;g.beginPath();g.arc(p[0],p[1]+bob,s*.5,0,7);g.fill();
  g.fillStyle='#e8f6ff';g.beginPath();g.arc(p[0],p[1]-s*.18+bob,s*.14,0,7);g.fill();
  g.beginPath();g.moveTo(p[0]-s*.2,p[1]+s*.22+bob);g.quadraticCurveTo(p[0],p[1]-s*.15+bob,p[0]+s*.2,p[1]+s*.22+bob);g.closePath();g.fill();
  g.fillStyle='#38507a';g.fillRect(p[0]-s*.07,p[1]-s*.2+bob,s*.04,s*.04);g.fillRect(p[0]+s*.03,p[1]-s*.2+bob,s*.04,s*.04);
  g.restore();
  {const mh=allyMaxHp(),r=Math.max(0,Math.min(1,ALLY_HP[al.i]/mh)),bw=s*.6;g.fillStyle='rgba(0,0,0,.55)';g.fillRect(p[0]-bw/2,p[1]-s*.45+bob,bw,4);g.fillStyle=r>.5?'#7fe3a0':r>.25?'#ffd36b':'#ff6f8a';g.fillRect(p[0]-bw/2,p[1]-s*.45+bob,bw*r,4)}
  const f=ALLY_FX[al.i];if(f){const q=sxy(f.x,f.y);g.strokeStyle='rgba(190,235,255,.9)';g.lineWidth=2;g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
}

const SC_PREFIX='TOMOSHIBI1',SC_FMT=1;
let SC_TEXT='',SC_IN='',SC_CONFIRM=null,SC_MSG='';
function scHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')}
function scEncode(){
  try{S.x=PL.x;S.y=PL.y}catch(e){}
  S.time=S.time||0;
  const env={fmt:SC_FMT,ver:S.ver||2,at:Date.now(),slot:SLOT,data:S};
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(env))));
  return SC_PREFIX+'.'+scHash(b64)+'.'+b64;
}
function scDecode(raw){
  const t=String(raw||'').replace(/\s+/g,'');
  if(!t)throw new Error('セーブコードが入力されていません');
  const p=t.split('.');
  if(p.length!==3||p[0]!==SC_PREFIX)throw new Error('セーブコードの形式が正しくありません');
  if(!/^[0-9a-f]{8}$/.test(p[1])||!/^[A-Za-z0-9+/=]+$/.test(p[2]))throw new Error('セーブコードの形式が正しくありません');
  if(scHash(p[2])!==p[1])throw new Error('セーブコードがこわれています（コピーが途中で切れていないか確認してください）');
  let env;try{env=JSON.parse(decodeURIComponent(escape(atob(p[2]))))}catch(e){throw new Error('セーブコードを読み取れませんでした')}
  if(!env||typeof env!=='object'||env.fmt!==SC_FMT)throw new Error('このセーブコードのバージョンには対応していません');
  const d=env.data;
  if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('セーブデータの中身が正しくありません');
  const num=k=>typeof d[k]==='number'&&isFinite(d[k]);
  if(!num('lv')||!num('hp')||!num('maxHp')||!num('mp')||!num('maxMp')||!num('coins')||d.maxHp<=0||d.lv<1)throw new Error('セーブデータの中身が正しくありません');
  if(d.flags!=null&&(typeof d.flags!=='object'||Array.isArray(d.flags)))throw new Error('セーブデータの中身が正しくありません');
  if(d.ver!=null&&(typeof d.ver!=='number'||d.ver>2))throw new Error('このセーブコードは新しいバージョンのゲームのものです');
  const st=parseSave(JSON.stringify(d));
  if(!st)throw new Error('セーブデータを読み取れませんでした');
  if(!st.flags||typeof st.flags!=='object')st.flags={};
  return st;
}
function scApply(st){
  const old=S,oldPause=mode;
  try{
    st.set=Object.assign({},old.set||{},{});
    S=st;CODELOAD=true;migrateSave();MIGDIRTY=false;
    closePanel();startGame(false);
    toast('セーブコードからロードしました（セーブするまで保存はされません）');
    return true;
  }catch(e){
    S=old;CODELOAD=false;
    try{startGame(false)}catch(e2){}
    toast('ロードに失敗しました。いまのデータはそのままです');
    return false;
  }
}

function onTick(dt){

  ON.acc+=dt;if(ON.acc>=.1){ON.acc=0;onSend(false)}
  const ps=ON.room.peers(),seen={};let idx=0;
  for(const p of ps){
    if(p.kind!=='viewer')continue;idx++;
    if(p.isMe)continue;const q=p.presence;
    if(!q||typeof q.x!=='number'||typeof q.y!=='number')continue;
    seen[p.peer]=1;let gh=ON.ghosts[p.peer];
    if(!gh)gh=ON.ghosts[p.peer]={x:q.x,y:q.y,c:ON_COLS[idx%ON_COLS.length],t:0};
    const same=q.ar===onKey();gh.same=same;gh.n=String(q.n||'').slice(0,8);gh.lv=q.lv|0;gh.at=q.at;gh.fx=+q.fx||0;gh.fy=+q.fy||1;gh.hp=q.hp;gh.dead=q.dead;
    const k=Math.min(1,dt*12);gh.x+=(q.x-gh.x)*k;gh.y+=(q.y-gh.y)*k;gh.t+=dt;
    if(Math.hypot(q.x-gh.x,q.y-gh.y)>6){gh.x=q.x;gh.y=q.y}
  }
  for(const id in ON.ghosts)if(!seen[id])delete ON.ghosts[id];
}
function onDrawList(L){
  if(!ON.room)return;
  for(const id in ON.ghosts){const gh=ON.ghosts[id];if(!gh.same||gh.dead)continue;L.push([gh.y,()=>onDrawGhost(gh)])}
}

  const t=gh.n+' Lv'+gh.lv;g.strokeText(t,p[0],p[1]-s*.52);g.fillText(t,p[0],p[1]-s*.52);
  const bw=s*.6,r=Math.max(0,Math.min(1,gh.hp==null?1:gh.hp));g.fillStyle='rgba(0,0,0,.55)';g.fillRect(p[0]-bw/2,p[1]-s*.47,bw,3);g.fillStyle=r>.5?'#7fe3a0':r>.25?'#ffd36b':'#ff6f8a';g.fillRect(p[0]-bw/2,p[1]-s*.47,bw*r,3);

/* ===== PeerJS（Claudeの外＝GitHub Pagesなどで動く通信）。部屋を作った人(ホスト)に全員がつながる星型 ===== */
function peerLoad(){
  return new Promise((res,rej)=>{
    if(window.Peer)return res(window.Peer);
    const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload=()=>window.Peer?res(window.Peer):rej(new Error('nolib'));s.onerror=()=>rej(new Error('nolib'));
    document.head.appendChild(s);setTimeout(()=>rej(new Error('nolib')),12000);
  });
}
function peerWait(peer,ms){return new Promise((res,rej)=>{
  const t=setTimeout(()=>rej(new Error('timeout')),ms);
  peer.on('open',id=>{clearTimeout(t);res(id)});
  peer.on('error',e=>{clearTimeout(t);rej(e)});
})}
function peerRoomObj(isHost){
  const R={ended:'',_pc:[],_cc:[],_conn:true,state:{},mine:{},myId:'',conns:{},hostConn:null,dirty:false,timer:0,peer:null};
  R.peers=()=>{const o=[{peer:R.myId,isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,presence:R.mine,updatedAt:0}];
    for(const id in R.state)if(id!==R.myId)o.push({peer:id,isMe:false,sameTab:false,kind:'viewer',guest:false,by:null,presence:R.state[id],updatedAt:0});return o};
  R.presence=pt=>{Object.assign(R.mine,pt);
    if(isHost){R.state[R.myId]=R.mine;R.dirty=true}
    else if(R.hostConn&&R.hostConn.open)R.hostConn.send({t:'p',d:R.mine});
    return Promise.resolve()};
  R.onPeers=f=>{R._pc.push(f);return()=>{R._pc=R._pc.filter(x=>x!==f)}};
  R.onConnection=f=>{R._cc.push(f);return()=>{R._cc=R._cc.filter(x=>x!==f)}};
  R.connected=()=>R._conn;
  R._fireP=()=>{const ch={peers:R.peers(),joined:[],left:[],updated:[]};for(const f of R._pc)try{f(ch)}catch(e){}};
  R._fireC=c=>{R._conn=c;for(const f of R._cc)try{f(c)}catch(e){}};
  R.leave=()=>{clearInterval(R.timer);try{R.peer&&R.peer.destroy()}catch(e){}R._pc=[];R._cc=[];return Promise.resolve()};
  return R;
}
async function peerJoin(name,PeerCls){
  const P=PeerCls||await peerLoad();
  // まず「ホスト」になれるか（その名前のIDが空いているか）ためす
  let peer=new P(name),R=null;
  try{await peerWait(peer,9000);R=peerRoomObj(true);}
  catch(e){
    try{peer.destroy()}catch(_){}
    if(!e||e.type!=='unavailable-id')throw e||new Error('peer');
    R=peerRoomObj(false);peer=new P();await peerWait(peer,9000);
  }
  R.peer=peer;R.myId=peer.id;
  if(peer.id===name){ // ホスト
    R.state[R.myId]=R.mine;
    peer.on('connection',c=>{
      c.on('open',()=>{
        const others=Object.keys(R.conns).length;
        if(others>=ON.max-1){try{c.send({t:'full'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},300);return}
        R.conns[c.peer]=c;R.dirty=true;
      });
      c.on('data',m=>{if(m&&m.t==='p'&&m.d&&typeof m.d==='object'){R.state[c.peer]=m.d;R.dirty=true}});
      const gone=()=>{if(R.conns[c.peer]===c){delete R.conns[c.peer];delete R.state[c.peer];R.dirty=true}};
      c.on('close',gone);c.on('error',gone);
    });
    R.timer=setInterval(()=>{
      if(!R.dirty)return;R.dirty=false;const all=R.state;R._fireP();
      for(const id in R.conns){const c=R.conns[id];if(c.open)try{c.send({t:'s',all})}catch(e){}}
    },100);
  }else{ // ゲスト
    await new Promise((res,rej)=>{
      const c=peer.connect(name,{reliable:false});R.hostConn=c;
      const t=setTimeout(()=>rej(new Error('timeout')),9000);
      c.on('open',()=>{clearTimeout(t);res()});
      c.on('error',e=>{clearTimeout(t);rej(e)});
      c.on('data',m=>{
        if(!m)return;
        if(m.t==='full'){R.ended='full';return}
        if(m.t==='s'&&m.all&&typeof m.all==='object'){
          const st={};for(const id in m.all)if(m.all[id]&&typeof m.all[id]==='object')st[id]=m.all[id];
          R.state=st;R._fireP();
        }
      });
      c.on('close',()=>{if(R.ended==='full')return;R.ended='ホストが部屋から出たので、部屋が終わりました';R._fireC(false)});
    });
    await new Promise(r=>setTimeout(r,700));
    if(R.ended==='full'){try{peer.destroy()}catch(e){}throw new Error('full')}
    R.hostConn.send({t:'p',d:R.mine});
  }
  return R;
}

        g.fillStyle='rgba(255,215,90,.9)';g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=2;
        g.beginPath();g.moveTo(TS*.4,0);g.lineTo(-TS*.2,-TS*.3);g.lineTo(-TS*.08,0);g.lineTo(-TS*.2,TS*.3);g.closePath();g.stroke();g.fill();g.restore();
        g.font='bold '+(TS*.3)+'px DotGothic16,sans-serif';g.textAlign='center';g.fillStyle='#000';g.fillText(nv.label+' '+Math.round(dd)+'m',ax+1,ay-TS*.42+1);g.fillStyle='#ffe08a';g.fillText(nv.label+' '+Math.round(dd)+'m',ax,ay-TS*.42);
      }
    }
  }
  // pops
  g.font='bold '+(s*.38)+'px DotGothic16,sans-serif';g.textAlign='center';
  for(const p of pops){const q=sxy(p.x,p.y-p.t*1.2);g.globalAlpha=clamp(1.6-p.t*2,0,1);g.fillStyle='#000';g.fillText(p.txt,q[0]+1,q[1]+1);g.fillStyle=p.col;g.fillText(p.txt,q[0],q[1])}
  g.globalAlpha=1;
  if(trans){const a=trans.t<1?trans.t:2-trans.t;g.fillStyle='rgba(4,6,16,'+clamp(a,0,1)+')';g.fillRect(0,0,VW,VH)}
}

/* ===== loop ===== */
let last=0,hudT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000||0));last=ts;FD=dt;
  try{
    if(mode==='play'&&!trans)update(dt);
    else if(mode==='dead'){updFx(dt);if(trans)updTrans(dt)}
    else if(mode==='talk'){tickDialog(dt);updFx(dt)}
    else if(mode==='menu'){}
    if(trans&&mode!=='dead')updTrans(dt);
    if(mode!=='title'){hudT-=dt;if(hudT<=0){hudT=.12;updHud()}}
    PRESS.a=PRESS.b=PRESS.x=PRESS.y=0;
    render();
  }catch(err){console.error(err);PRESS.a=PRESS.b=PRESS.x=PRESS.y=0}
}

/* ===== start / title ===== */
function startGame(isNew){
  applySettings();
  document.body.classList.add('playing');$('#title').style.display='none';
  PL.dead=false;PL.fx=0;PL.fy=1;PL.combo=0;trans=null;mode='play';
  if(S.area==='arena2'){S.area='castle2';S.x=S.y=null}
  if(S.area==='arena3'){S.area='nkeep';S.x=S.y=null}
  let a=(S.area==='abyss'||S.area==='tower')?'towerIsle':S.area;
  if(a!=='village'&&a!=='towerIsle'&&a!=='world'&&a!=='world2'&&!DUNG[a]&&!HIDD[a])a='village';
  if(isNew)loadArea('village');else if(a==='towerIsle')loadArea('towerIsle');else if(a==='village')loadArea('village');
  else loadArea(a,S.x,S.y);
  if(isNew){
    mode='play';
    say('',['……灯が、消えていく。','真っ暗な世界で、ひとつだけ小さな光があなたを呼んでいる。','まずは、チュートリアルをやってみよう。（終わったら村の長老ルミナに話しかけよう）']);
  }
}
function toTitle(){
  mode='title';document.body.classList.remove('playing');
  $('#title').style.display='flex';$('#dialog').style.display='none';$('#menu').style.display='none';
  refreshTitle();musicSet('village');
}
function areaLabel(id){
  if(id==='village')return 'ともしびの村';if(id==='world')return 'ワールド';if(id==='world2')return '新ワールド';if(id==='home')return '自分の家';if(id==='homeIsle')return '西の島';if(id==='tower')return '試練の塔';if(id==='towerIsle')return '試練の塔の島';if(id==='abyss')return '試練の塔';
  if(DUNG[id])return DUNG[id].name;if(HIDD[id])return HIDD[id].name;return '';
}
let delArm=0,delT=0;
function refreshTitle(){
  const box=$('#slots');if(!box)return;box.textContent='';
  for(let n=1;n<=3;n++){
    const sv=loadSlot(n),row=document.createElement('div');row.className='slot'+(sv?'':' empty');
    const m=document.createElement('button');m.className='slotMain';
    const b=document.createElement('b'),sm=document.createElement('small');
    if(sv){
      const t=Math.floor((sv.time||0)/3600)+'時間'+Math.floor((sv.time||0)%3600/60)+'分',nsw=Object.keys(sv.swords||{}).length;
      b.textContent='データ'+n+'　Lv'+sv.lv+'　'+t+(sv.ng?'　'+(sv.ng+1)+'周目':'');
      sm.textContent=((sv.flags&&sv.flags.gameClear)?'★クリア済み　':'')+(areaLabel(sv.area)||'')+'　剣 '+nsw+'/'+SWD.length;
    }else{b.textContent='データ'+n+'　はじめから';sm.textContent='あたらしく冒険をはじめる'}
    m.appendChild(b);m.appendChild(sm);m.addEventListener('click',()=>pickSlot(n));row.appendChild(m);
    if(sv){
      const d=document.createElement('button');d.className='slotDel'+(delArm===n?' arm':'');d.textContent=delArm===n?'本当に消す':'消す';
      d.addEventListener('click',()=>{
        if(delArm===n){delArm=0;eraseSlot(n);refreshTitle();return}
        delArm=n;clearTimeout(delT);delT=setTimeout(()=>{delArm=0;refreshTitle()},3500);refreshTitle();
      });row.appendChild(d);
    }
    box.appendChild(row);
  }
}
let MIGDIRTY=false,L0note=false,L1note=false,P10note=null;
function migrateSave(){
  if(!S.ver){S.ver=2;if(S.flags.gameClear&&!S.flags.grantL0){S.flags.grantL0=1;if(S.swords.L0==null){S.swords.L0=0;S.equip='L0';L0note=true}}}
  if(S.flags.grantL0&&!S.flags.grantL1){S.flags.grantL1=1;if(S.swords.L1==null){S.swords.L1=0;L1note=true;if(!S.equip)S.equip='L1'}}
  if(S.flags.era2)megaEvolve();
  dedupeMega();
  if((S.flags.gameClear||S.flags.era2)&&!S.flags.p10b){S.flags.p10b=1;S.flags.p10=1;
    const id=(S.flags.era2||S.swords.M0!=null)?'M0':'L0';
    if((S.swords[id]||0)<10||S.swords[id]==null){
      S.swords[id]=10;S.swx=S.swx||{};S.swx[id]=0;
      if(!S.equip||S.equip==='L0'||S.equip==='M0')S.equip=id;
      P10note=swDef(id).n}
    MIGDIRTY=true}
  if(!S.flags.wmV){S.flags.wmV=1;S.time=S.time||0;
    S.wm={next:S.time+1200+Math.random()*1800,until:S.time+1500,loc:'village',stock:wmMake(),last:'village',seen:0};MIGDIRTY=true}
}
function pickSlot(n){
  auInit();SLOT=n;try{localStorage.setItem('tomoshibi_slot',String(n))}catch(e){}
  const sv=loadSlot(n),set=S.set;
  if(sv){S=sv;migrateSave();startGame(false);
    if(MIGDIRTY){MIGDIRTY=false;saveGame(true,true)}
    if(P10note){const nm=P10note;P10note=null;setTimeout(()=>say('',['【クリアのごほうび】','「'+nm+'」が +10 まで鍛え上げられた！']),500)}
    if(L0note||L1note){const ln=['【クリアのごほうび】'];
      if(L0note)ln.push('「神話の燈火刀」が手に届いた！','3連撃目に衝撃波、敵を倒すたびにHP・MPが半分回復、攻撃力は1.5倍。');
      if(L1note)ln.push('「伝説ともしび剣」も手に届いた！','必殺技を出すと、5秒間 敵が光で目つぶしされて動けなくなる。');
      ln.push('（メニューの「装備」で装備を変えられる）');L0note=L1note=false;setTimeout(()=>say('',ln),400)}
  }else{S=newState();S.ver=2;S.set=set;S.tut=0;tutCnt=0;tutLast='';startGame(true);setTimeout(()=>{if(S.tut===0&&TUT[0].on)TUT[0].on();tutLast='';tutShow()},600)}
}
$('#btnSound').addEventListener('click',()=>{auInit();const on=!(S.set.sfx||S.set.mus);S.set.sfx=on;S.set.mus=on;applySettings();sfx('menu')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode!=='title'&&A&&!PL.dead)saveGame(true,true)});
addEventListener('pagehide',()=>{if(mode!=='title'&&A&&!PL.dead)saveGame(true,true)});
(function boot(){
  const s=latestSave();if(s){S.set=s.set}
  applySettings();refreshTitle();mode='title';cloudInit();
  requestAnimationFrame(frame);
})();
window.__game={get S(){return S},get mode(){return mode},get A(){return A},PL,loadArea,btnDown,enemies:()=>enemies};
</script>
